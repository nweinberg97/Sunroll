<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sunroll · Find the time that works everywhere.</title>
    <meta name="description" content="Everyone marks when they’re free. Sunroll shows the whole group in your time zone, and the times that work for everyone glow. Free, no sign-up." />
    <meta name="theme-color" content="#fff8ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100e22" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!-- Link previews. Event pages are rewritten with event-specific tags by api/share (Vercel). -->
    <meta property="og:site_name" content="Sunroll" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sunroll · Find the time that works everywhere." />
    <meta property="og:description" content="Everyone marks when they’re free. The times that work for everyone glow." />
    <meta property="og:image" content="%VITE_PUBLIC_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Apply the saved theme before first paint, so there's no flash.
      try {
        var t = localStorage.getItem('sunroll:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; font-family: system-ui, sans-serif">Sunroll needs JavaScript to find a time for your group.</div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
