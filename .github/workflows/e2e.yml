name: End-to-end (local Supabase)

# Runs on every branch except main, and on pull requests. Never deploys anything:
# it starts a throwaway Supabase inside the runner and tears it down afterwards.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start a local Supabase and apply the migrations
        run: supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,postgres-meta
      - name: Read local API URL and anon key
        run: |
          supabase status -o env > supabase.env
          set -a; . ./supabase.env; set +a
          echo "VITE_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build against the local Supabase
        run: npm run build
        env:
          VITE_DATA_BACKEND: supabase
      - name: Two browsers, two time zones, one shared event
        shell: bash
        run: |
          set +e
          npm run e2e 2>&1 | tee e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the failure as annotations (readable without downloading logs).
            grep -vE '^\s*$' e2e.log | grep -E 'Error|error|expect|Expected|Received|Timeout|waiting for|On screen|[0-9]{3} http|›|✘' | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $status
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Supabase logs on failure
        if: failure()
        run: |
          for c in $(docker ps -a --format '{{.Names}}' | grep -E 'realtime|rest'); do
            docker logs --tail 40 $c 2>&1 | grep -iE 'error|fatal|denied' | tail -8 | while IFS= read -r line; do echo "::warning::[$c] ${line}"; done
          done
